name: Create new Slack channels

on:
  push:
    branches: [main]
    paths: ['data/channels.json']

jobs:
  create-channels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect and create new channels
        env:
          CANDEBOT_URL: ${{ secrets.CANDEBOT_URL }}
          CANDEBOT_API_KEY: ${{ secrets.CANDEBOT_API_KEY }}
        run: ./scripts/create-new-channels.sh
